# Config Nginx à déployer sur la machine hôte (/etc/nginx/sites-available/
# ecole360.infini-software.cloud), sur le modèle exact de
# infini-software/deploy/nginx-infini-software.cloud.conf — même serveur,
# même Nginx hôte global. Tourne DIRECTEMENT sur l'hôte, PAS dans Docker : le
# backend (voir docker-compose.web.yml, service "app") n'expose son port que
# sur 127.0.0.1:9007, donc ce Nginx hôte reste le seul point d'entrée public
# et le seul à terminer le TLS (certificats gérés par certbot).
#
# ecole_nginx sert son API ET ses fichiers statiques (uploads) lui-même sous
# un seul process FastAPI (/api/v1/* et /static/*, voir app/main.py) — mais
# /static/ est intercepté ici et servi directement par nginx depuis le bind
# mount du docker-compose.web.yml (./data/persist/static, voir son service
# "app"), pour éviter que chaque logo/photo passe par le process Python. Tout
# le reste (dont /api/v1/*) part vers le backend sans distinction, via le
# location / catch-all en bas. Déploiement sur /opt/edu (srv817831).
#
# Timeouts/buffering alignés sur ecole_nginx/docker/nginx.conf (usage local) :
# la génération de PDF/rapports peut prendre du temps, et les uploads
# (photos, documents) peuvent être volumineux.

server {
    listen 443 ssl http2;
    server_name ecole360.infini-software.cloud;

    ssl_certificate     /etc/letsencrypt/live/ecole360.infini-software.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecole360.infini-software.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location /static/ {
        alias /opt/edu/data/persist/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:9007;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_send_timeout    300;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ecole360.infini-software.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


