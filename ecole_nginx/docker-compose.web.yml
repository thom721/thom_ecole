# Déploiement WEB d'ecole_nginx sur un serveur partagé où un Nginx hôte
# existe déjà globalement pour plusieurs services (voir
# infini-software/docker-compose.yml, même topologie et même raisonnement) —
# donc pas de service nginx/certgen ici : "app" n'expose son port que sur
# 127.0.0.1, ce Nginx hôte (voir deploy/nginx-ecole360.infini-software.cloud.conf)
# reste le seul point d'entrée public et le seul à terminer le TLS
# (certificats gérés par certbot).
#
# Pour l'auto-hébergement local (aplekol360.local, clients LAN via
# app_gui.py), utilise docker-compose.yml à la place — ce fichier ne le
# remplace pas, c'est un déploiement différent.
#
# Secrets attendus dans un fichier .env.web (jamais commité, voir
# .env.web.example) : MYSQL_ROOT_PASSWORD, SECRET_KEY.
#   docker compose -f docker-compose.web.yml --env-file .env.web up -d --build
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lekol360
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Pas de port publié vers l'hôte : contrairement à docker-compose.yml
    # (usage local, où 3307 évite un conflit avec un MySQL natif sur la
    # machine), seul le service "app" ci-dessous (même réseau Docker) a
    # besoin d'y accéder ici.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: lekol360
      SECRET_KEY: ${SECRET_KEY}
      # Calculée sur la machine hôte (voir scripts/start.sh) : dans un
      # conteneur, uuid.getnode() renverrait l'adresse MAC virtuelle du
      # conteneur, pas celle de la machine, ce qui rendrait la licence
      # instable. Optionnel : ${HOST_MAC_ADDRESS:-}.
      HOST_MAC_ADDRESS: ${HOST_MAC_ADDRESS:-}
      # L'abonnement/licence est rattaché à l'installation locale (mac de CE
      # serveur), pas à ce VPS qui héberge une copie web — une vérification
      # indépendante ici échouerait à chaque redémarrage (mac différent de
      # celui qui a généré la clé) et bloquerait tout le monde sans rapport
      # avec l'état réel de l'abonnement. Voir app/main.py::_run_startup_tasks.
      DISABLE_LICENSE_CHECK: "true"
      LICENSE_FILE: /data/license.json
      STATIC_DATA_DIR: /data/static
      # Origines autorisées en CORS (voir app/main.py) — vide par défaut,
      # donc "*" tant que non définie. En production, une seule origine
      # (ou plusieurs séparées par des virgules) : voir .env.web.example.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      # SMTP (voir app/utils/students_email.py) — deux boîtes distinctes :
      # noreply@ pour les notifications automatiques, contact@ pour le
      # formulaire de contact public. Passés ici (pas seulement dans
      # app/.env) pour ne pas dépendre du contenu de l'image Docker au
      # moment du build — voir .env.web.example pour les valeurs réelles.
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IUSTH}
      SMTP_USER_NOREPLY: ${SMTP_USER_NOREPLY:-}
      SMTP_PASSWORD_NOREPLY: ${SMTP_PASSWORD_NOREPLY:-}
      SMTP_USER_CONTACT: ${SMTP_USER_CONTACT:-}
      SMTP_PASSWORD_CONTACT: ${SMTP_PASSWORD_CONTACT:-}
      # URL publique du frontend pour le lien "Se connecter" dans les emails
      # d'activation (voir app/utils/students_email.py) — sans elle, retombe
      # sur https://aplekol360.local (LAN local), inutilisable pour un vrai
      # destinataire.
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Webhook de synchronisation temps réel VERS elearning-iusth (Épic 20,
      # elearning-iusth) — appel sortant fire-and-forget déclenché en
      # arrière-plan (BackgroundTasks) après inscription/changement de
      # professeur. Même valeur que elearning-iusth/.env.production::
      # ECOLE_NGINX_WEBHOOK_KEY. Vide par défaut : tant que non renseignée,
      # aucun appel n'est tenté (voir Helper/elearning_webhook.py, échecs
      # réseau déjà interceptés et journalisés, jamais bloquants).
      ELEARNING_WEBHOOK_URL: ${ELEARNING_WEBHOOK_URL:-}
      ELEARNING_WEBHOOK_KEY: ${ELEARNING_WEBHOOK_KEY:-}
      # Export en lecture seule pour elearning-iusth (import de cours +
      # synchro identifiants professeur/personnel, Épics intégration +
      # Épic 22) — clé partagée machine-à-machine, même valeur que
      # elearning-iusth/.env.production::ECOLE_NGINX_INTEGRATION_KEY.
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      # Désactivé par défaut : exporter un hash de mot de passe (Épic 22)
      # est plus sensible que le reste de l'export en lecture seule — à
      # activer explicitement ("true") seulement si la synchro des
      # identifiants est réellement voulue en production.
      INTEGRATION_ALLOW_CREDENTIAL_SYNC: ${INTEGRATION_ALLOW_CREDENTIAL_SYNC:-false}
    volumes:
      # Bind mount (pas un volume nommé) : le Nginx hôte a besoin d'un vrai
      # chemin sur disque pour servir /static/ directement via alias (voir
      # deploy/nginx-ecole360.infini-software.cloud.conf) sans repasser par
      # ce process à chaque fichier. Persiste de la même façon qu'un volume
      # nommé across docker compose up --build (seul `down -v` ou une
      # suppression manuelle du dossier l'efface) — voir ./data/persist/
      # dans .gitignore, ne pas committer son contenu.
      - ./data/persist:/data
      # access.log/error.log (gunicorn, voir Dockerfile) directement lisibles
      # sur l'hôte — même pattern que /opt/post/logs déjà en place sur ce
      # serveur pour post_api.
      - ./logs:/srv/ecole_nginx/logs
    ports:
      # Bind sur localhost uniquement : le Nginx hôte fait déjà le proxy
      # HTTPS public, ce port n'a pas besoin d'être exposé à l'extérieur.
      # 9007 (pas 9003/9004) : déjà pris par d'autres projets sur ce serveur
      # (post_api, infini-software backend — voir
      # infini-software/docker-compose.yml).
      - "127.0.0.1:9007:9001"

volumes:
  mysql_data:
