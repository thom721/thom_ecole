# Config Nginx à déployer sur la machine hôte de production
# (/etc/nginx/sites-available/elearning.infini-software.cloud), sur le
# modèle exact de ecole_nginx/deploy/nginx-ecole360.infini-software.cloud.conf
# — même serveur, même Nginx hôte global. Ce nginx hôte reste le seul
# point d'entrée public et le seul à terminer le TLS (certificats gérés
# par certbot) ; le conteneur "app" (voir docker-compose.yml) n'a besoin
# d'être joignable que sur 127.0.0.1:8000.

server {
    listen 443 ssl http2;
    server_name elearning.infini-software.cloud;

    ssl_certificate     /etc/letsencrypt/live/elearning.infini-software.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elearning.infini-software.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_send_timeout    300;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name elearning.infini-software.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
