# Config Nginx à déployer sur la machine hôte de production
# (/etc/nginx/sites-available/meet.iusth.edu.ht), sur le modèle exact de
# ecole_nginx/deploy/nginx-ecole360.infini-software.cloud.conf — même
# principe : ce nginx hôte tourne DIRECTEMENT sur le serveur, PAS dans
# Docker, et reste le seul point d'entrée public / le seul à terminer le
# TLS (certificats gérés par certbot). Le conteneur jitsi-web (voir
# docker-compose.jitsi.yml, JITSI_DISABLE_HTTPS=1 côté .env.production) ne
# sert que du HTTP en clair sur 127.0.0.1:8090 — jamais exposé directement
# à Internet.
#
# Un seul serveur Jitsi pour tout le projet : sert à la fois les cours en
# direct (Épic 17) et les réunions du personnel (Épic 21) — les deux ne
# sont que des "salles" différentes sur ce même serveur, voir
# Helper/live_sessions.py::build_jitsi_jwt réutilisé pour les deux.
#
# Support WebSocket nécessaire (Connection/Upgrade) : jitsi-web sert sa
# propre interface ET fait suivre en interne /xmpp-websocket et
# /http-bind (BOSH) vers prosody via son propre nginx embarqué — ce nginx
# hôte n'a besoin que de faire suivre les en-têtes WebSocket sans
# connaître ces chemins spécifiquement.

server {
    listen 443 ssl http2;
    server_name meet.iusth.edu.ht;

    ssl_certificate     /etc/letsencrypt/live/meet.iusth.edu.ht/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.iusth.edu.ht/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Nécessaire pour /xmpp-websocket (signalisation temps réel).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_send_timeout    300;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name meet.iusth.edu.ht;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
